services:

### REQUIREMENTS ###

## MARIADB
  mariadb:
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent"]
      interval: 3s
      timeout: 3s
      retries: 20
    build:
      context: ./requirements/mariadb
      args: { ALPINE_VERSION: "3.23" }
    image: mariadb
    container_name: mariadb
    restart: always
    env_file: .env
    secrets: [db_password, db_root_password]
    volumes:
      - db_data:/var/lib/mysql
    networks: [inception]


## WORDPRESS
  wordpress:
    build:
      context: ./requirements/wordpress
      args: { ALPINE_VERSION: "3.23" }
    image: wordpress
    container_name: wordpress
    restart: always
    env_file: .env
    secrets: [db_password, wp_admin_password, wp_password]
    volumes:
      - wp_data:/var/www/html
    networks: [inception]
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started


## NGINX
  nginx:
    build:
      context: ./requirements/nginx
      args: { ALPINE_VERSION: "3.23" }
    image: nginx
    container_name: nginx
    restart: always
    env_file: .env
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html:ro
    networks: [inception]
    depends_on:
      - wordpress
      - adminer

### BONUSES ###

## REDIS
  redis:
    build:
      context: ./bonus/redis
      args: { ALPINE_VERSION: "3.23" }
    image: redis
    container_name: redis
    restart: always
    env_file: .env
    networks: [inception]


## STATIC SITE
  site:
    build:
      context: ./bonus/site
      args: { ALPINE_VERSION: "3.23" }
    image: site
    container_name: site
    restart: always
    volumes:
      - site_data:/usr/share/site:rw
    env_file: .env
    networks: [inception]


## FTP SERVER
  ftp:
    build:
      context: ./bonus/ftp
      args: { ALPINE_VERSION: "3.23" }
    image: ftp
    container_name: ftp
    restart: always
    env_file: .env
    secrets: [ftp_password]
    volumes:
      - wp_data:/srv/ftp/wp_data:rw
      - site_data:/srv/ftp/site_data:rw
    networks: [inception] 
    ports: ["21:21", "21000-21010:21000-21010"]


## ADMINER
  adminer:
    build:
      context: ./bonus/adminer
      args: { ALPINE_VERSION: "3.23" }
    image: adminer
    container_name: adminer
    restart: always
    networks: [inception]
    depends_on:
      mariadb:
        condition: service_healthy
    
 
## OLLAMA
  ollama:
    healthcheck:
        test: ["CMD", "ollama", "list"]
        interval: 3s
        timeout: 10s
        retries: 5
    build:
      context: ./bonus/ollama
      args: { ALPINE_VERSION: "3.23" }
    image: ollama
    container_name: ollama
    restart: always
    volumes: 
      - ollama_data:/models
    networks: [inception]

## FLASK API
  chat:
    build:
      context: ./bonus/chat
      args: { ALPINE_VERSION: "3.23" }
    image: chat
    container_name: chat
    env_file: .env
    restart: always
    networks: [inception]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress
  site_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/site
  ollama_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/ollama

networks:
  inception:
    driver: bridge

secrets:
  db_password: { file: ../secrets/db_password.txt }
  db_root_password: { file: ../secrets/db_root_password.txt }
  wp_password: { file: ../secrets/wp_password.txt }
  wp_admin_password: { file: ../secrets/wp_admin_password.txt }
  ftp_password: { file: ../secrets/ftp_password.txt }

