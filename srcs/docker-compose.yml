services:
  mariadb:
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent"]
      interval: 3s
      timeout: 3s
      retries: 20
    build:
      context: ./requirements/mariadb
      args: { ALPINE_VERSION: "3.23" }
    image: mariadb
    container_name: mariadb
    restart: always
    env_file: .env
    secrets: [db_password, db_root_password]
    volumes:
      - db_data:/var/lib/mysql
    networks: [inception]
  wordpress:
    build:
      context: ./requirements/wordpress
      args: { ALPINE_VERSION: "3.23" }
    image: wordpress
    container_name: wordpress
    restart: always
    env_file: .env
    secrets: [db_password, wp_admin_password, wp_password]
    volumes:
      - wp_data:/var/www/html
    networks: [inception]
    depends_on:
      mariadb:
        condition: service_healthy
  nginx:
    build:
      context: ./requirements/nginx
      args: { ALPINE_VERSION: "3.23" }
    image: nginx
    container_name: nginx
    restart: always
    env_file: .env
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html:ro
    networks: [inception]
    depends_on:
      - wordpress

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress

networks:
  inception:
    driver: bridge

secrets:
  db_password: { file: ../secrets/db_password.txt }
  db_root_password: { file: ../secrets/db_root_password.txt }
  wp_password: { file: ../secrets/wp_password.txt }
  wp_admin_password: { file: ../secrets/wp_admin_password.txt }

